  <script>
    // 视频加载策略：先用 poster 海报图立即呈现画面，视频就绪后无缝接管播放。
    // 窄屏、省流量模式或减少动态偏好下不加载视频，直接用海报/静态背景。
    (function () {
      var video = document.getElementById('coverVideo');
      if (!video) return;

      var conn = navigator.connection || {};
      var slow = conn.saveData === true ||
        /(^|\b)(2g|slow-2g)$/.test(conn.effectiveType || '');
      var narrow = window.matchMedia('(max-width: 720px)').matches;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 海报图立即淡入，打开页面即有画面
      video.classList.add('is-ready');

      if (slow || narrow || reduced) {
        // 仅保留海报，不下载视频
        return;
      }

      function start() {
        video.play().catch(function () {});
      }
      video.addEventListener('loadeddata', start, { once: true });
      video.addEventListener('canplay', start, { once: true });

      video.addEventListener('error', function () {
        // 视频失败时保留海报图
      }, { once: true });

      var src = document.createElement('source');
      src.src = 'assets/cover-720.mp4';
      src.type = 'video/mp4';
      video.appendChild(src);
      video.preload = 'auto';
      video.load();
    })();
  </script>
  <script src="admin.js"></script>
</body>
